services:
  - type: web
    name: tn-scheme-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: project/tamilnadu-scheme-assistant/backend
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_PATH
        value: data/schemes.db
